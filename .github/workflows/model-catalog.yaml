name: model-catalog-checks

on:
  pull_request:
    paths:
      - "labs/**"
      - "modules/**"
      - "shared/models.json"
      - "scripts/check_model_catalog.py"
      - ".github/workflows/model-catalog.yaml"
    branches: [main]
  push:
    paths:
      - "labs/**"
      - "modules/**"
      - "shared/models.json"
      - "scripts/check_model_catalog.py"
      - ".github/workflows/model-catalog.yaml"
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  model-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.14
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: model catalogue check
        run: |
          python ./scripts/check_model_catalog.py --fix-suggestions
